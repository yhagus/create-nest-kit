name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# All 240 combos, in one matrix per pattern: GitHub runs at most 256 jobs per matrix.
jobs:
  service:
    name: Matrix (all service combos)
    uses: ./.github/workflows/matrix.yml
    with:
      subset: all
      only: '*-service'

  cqrs:
    name: Matrix (all CQRS combos)
    uses: ./.github/workflows/matrix.yml
    with:
      subset: all
      only: '*-cqrs'
